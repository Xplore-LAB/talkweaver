[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkweaver"
version = "0.1.0a2"
description = "Agent-first local processing of talks into slides, transcripts and illustrated notes"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "TalkWeaver contributors"}]
dependencies = [
  "numpy>=1.26,<3", "opencv-python-headless>=4.10,<6", "Pillow>=10,<14",
  "reportlab>=4,<5", "PyMuPDF>=1.25,<2"
]

[project.optional-dependencies]
local-ai = ["torch>=2.5,<3", "transformers>=5,<6", "accelerate>=1,<2", "soundfile>=0.12,<1"]

[project.scripts]
talkweaver = "talkweaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/talkweaver" = ["SKILL.md", "LICENSE"]
"share/talkweaver/docs" = ["docs/usage.md"]
